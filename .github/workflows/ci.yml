name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bang
          POSTGRES_PASSWORD: bang_dev
          POSTGRES_DB: bang
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bang -d bang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bang:bang_dev@127.0.0.1:54329/bang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:check
