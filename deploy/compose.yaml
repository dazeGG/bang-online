# Production stack on the shared VoiceRoom host. VoiceRoom's Caddy terminates HTTPS and
# reaches bang-app over the external voiceroom_default network; nothing publishes host ports.
# Service names are prefixed: every alias on voiceroom_default is visible to other stacks there.
# A guest on that host: the low CPU weight (Docker default 1024) yields to VoiceRoom when both want the CPU.
name: bang

services:
  bang-db:
    image: postgres:18-alpine
    restart: unless-stopped
    cpu_shares: 256
    environment:
      POSTGRES_USER: bang
      POSTGRES_DB: bang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
    volumes:
      - db-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bang -d bang']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 160M
    logging: &logging
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  bang-app:
    image: ${BANG_IMAGE:?set BANG_IMAGE}
    restart: unless-stopped
    cpu_shares: 256
    # Replaces the image check: starting node for each probe costs most of a second of CPU.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      bang-db:
        condition: service_healthy
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      DATABASE_URL: postgresql://bang:${POSTGRES_PASSWORD}@bang-db:5432/bang
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=128
    networks:
      internal: {}
      voiceroom_default:
        aliases: [bang-app]
    deploy:
      resources:
        limits:
          memory: 192M
    logging: *logging

networks:
  internal: {}
  voiceroom_default:
    external: true

volumes:
  db-data:
