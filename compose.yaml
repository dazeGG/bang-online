name: bang-online

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bang
      POSTGRES_PASSWORD: bang_dev
      POSTGRES_DB: bang
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bang -d bang']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
